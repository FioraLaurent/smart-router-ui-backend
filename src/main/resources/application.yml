server:
  port: 8080

spring:
  application:
    name: smart-router
  datasource:
    url: jdbc:sqlite:./data/smart_router.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

logging:
  level:
    com.smartrouter: INFO
    org.hibernate.SQL: WARN
